<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anonymous Collectives | Stay Low. Stand Out.</title>
    <meta
      name="description"
      content="Anonymous Collectives is a streetwear label built on quiet confidence. Shop tank tops, beanies and more, and order on WhatsApp."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#111111" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anonymous Collectives" />

    <meta property="og:image" content="/assets/banners/hero-main.jpg" />
    <link rel="icon" type="image/png" href="/assets/logo/favicon.png" />

    <!-- Sets light/dark BEFORE first paint so there is no flash of the wrong theme -->
    <script>
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('ac:theme')
        } catch (e) {
          /* storage blocked */
        }
        if (theme !== 'light' && theme !== 'dark') theme = 'dark'
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
