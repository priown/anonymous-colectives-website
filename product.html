<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="product">

  <div id="site-header-mount" class="h-16 lg:h-20"></div>

  <main id="main">

  <script src="js/products.js"></script>

  <script src="js/product.js"></script>
